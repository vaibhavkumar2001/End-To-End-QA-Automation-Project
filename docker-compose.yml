services:
  tests:
    build: .
    env_file: .env
    # Recommended by Playwright for Chromium in containers
    ipc: host
    volumes:
      # Reports and snapshots appear on your machine after the run
      - ./playwright-report:/app/playwright-report
      - ./allure-results:/app/allure-results
      - ./test-results:/app/test-results
      - ./tests:/app/tests

  k6:
    image: grafana/k6
    volumes:
      - ./performance:/scripts
    command: run /scripts/booking-load.js